# Tur tekshiruvi (CI): sof, alohida sinovdan o'tadigan modullar — bosqichlar mashinasi, ball hisobi, sozlamalar,
# statik fayllar, kuzatuv va ishlatish. Qolgan modullar asta-sekin qo'shiladi.
[mypy]
python_version = 3.12
files = app/octagon_flow.py, app/octagon_scoring.py, app/config.py, app/assets.py, app/observability.py, app/ops.py
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
